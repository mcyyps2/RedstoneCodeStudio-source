<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedstoneCodeStudio v2.0.0 - Minecraft插件可视化开发工具</title>
  <meta name="description" content="专业的Minecraft插件可视化开发工具，支持Spigot/Paper插件开发">
  <meta name="keywords" content="minecraft, spigot, paper, plugin, visual, development, ide">
  
  <!-- 预加载 -->
  <link rel="preload" href="dist/assets/index.css" as="style">
  <link rel="preload" href="dist/assets/index.js" as="script">
  
  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- 图标 -->
  <link rel="icon" type="image/svg+xml" href="@assets/redstone-icon.svg">
  
  <!-- SEO Meta -->
  <meta property="og:title" content="RedstoneCodeStudio v2.0.0">
  <meta property="og:description" content="专业的Minecraft插件可视化开发工具">
  <meta property="og:type" content="software">
  <meta property="og:url" content="https://github.com/mcyyps2/RedstoneCodeStudio-source">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RedstoneCodeStudio v2.0.0">
  <meta name="twitter:description" content="专业的Minecraft插件可视化开发工具">
  
  <!-- 现代化支持 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#667eea">
  
  <!-- 本地资源占位符 -->
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    
    #app {
      min-height: 100vh;
    }
    
    /* 加载动画 */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  
  <!-- Vite构建的CSS将在运行时注入 -->
</head>
<body>
  <!-- 加载指示器 -->
  <div class="loading-container" id="loading">
    <div class="loading-spinner"></div>
  </div>
  
  <!-- Vue应用根元素 -->
  <div id="app"></div>
  
  <!-- 应用配置 -->
  <script type="module">
    // 应用配置
    window.APP_CONFIG = {
      VERSION: '2.0.0',
      STAGE: 'Phase 4: Architecture Upgrade',
      BUILD_DATE: '2026-08-15',
      GIT_HASH: 'HEAD',
      ENV: process.env.NODE_ENV || 'development'
    }
    
    // 开发环境配置
    if (APP_CONFIG.ENV === 'development') {
      console.log('%cRedstoneCodeStudio v2.0.0 - Development Mode', 'color: #667eea; font-weight: bold; font-size: 1.2em;')
      console.log('%cStage: Architecture Upgrade', 'color: #764ba2;')
      console.log('%cBuild Date:', APP_CONFIG.BUILD_DATE)
      console.log('%cGit Hash:', APP_CONFIG.GIT_HASH)
    }
  </script>
  
  <!-- Vite构建的JS将在运行时注入 -->
  <script type="module" src="/src/main.ts"></script>
  
  <!-- PWA支持占位符 -->
  <script>
    // 检查是否支持Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // 注册PWA Service Worker
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('SW registered: ', registration)
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError)
        })
      })
    }
  </script>
</body>
</html>
